// TFC RTV - rock the vote, nominations and the end-of-map vote (metamod-p)
// "key value" per line. Anything after // is a comment. Reloaded every map
// start, or with "rtv_reload" in the server console.

enabled              1
debug                1       // rtv_trace.log next to the DLL (votes, AFK, map changes)

// ---------------------------------------------------------------- rock the vote
rtv_percent          40      // % of the players here needed to pass (AFK players don't count)
rtv_min_players      2       // RTV needs at least this many players here
rtv_include_bots     0       // 1 = bots count toward the total (they never vote)
rtv_mapstart_delay   180     // seconds into a map before rtv is allowed
rtv_admin_instant    1       // an admin's rtv starts the vote straight away
afk_time             60      // seconds without any input before someone is AFK

// ---------------------------------------------------------------- maps
map_history          3       // this many recent maps (the current one included) can't be nominated (0 - 50)
map_immune                   // maps that are never banned and don't count toward map_history, e.g.
                             //   map_immune 2fort well    (spaces or commas; * works, e.g. cz*; the line can repeat)
maps_file                    // map list for nominations; empty = the server's mapcycle file
nominate_typed       1       // typing just a map's name in chat nominates it

// ---------------------------------------------------------------- the vote
vote_maps            9       // maps in the vote, up to 9 (1-9; 0 is "no vote") - most-nominated first, then random ones
vote_duration        15      // seconds a vote lasts
vote_countdown       5       // countdown before the vote opens
vote_confirm         1       // a number must be pressed twice to vote (so weapon keys don't vote by accident)
runoff               1       // if the top two are close, a second vote between just those two
runoff_percent       5       // "close" = within this % of the votes cast
runoff_duration      15
change_delay         5       // after an rtv vote: seconds until the map changes

// ---------------------------------------------------------------- end of the map (mp_timelimit)
endmap_vote          1
endmap_warn_time     300     // seconds left: "nominate maps now" warning
endmap_vote_time     180     // seconds left: the vote starts; its winner is the next map
control_nextmap      1       // the map change at the end always goes to our next map (voted, or next in the cycle)

sounds               1       // voice countdown and a bell when the vote opens

// ---------------------------------------------------------------- chat tips
advert_interval      300     // seconds between tips in chat on how to rtv / nominate (0 = off)
advert_first         120     // the first tip this many seconds into a map
advert_join          25      // tell each player how it works this long after they join (once per server session; 0 = off)
// advert               "Your own tip here"   // up to 8 lines (under ~170 characters each); they replace the built-in tips

// ---------------------------------------------------------------- admins
amxx_users           1       // admins from AMX Mod X users.ini (SteamID entries)...
amxx_flag            f       // ...that have this access flag (f = AMXX's map flag)
// admin STEAM_0:1:12345
